<script>
/* =====================================================================
   JeSuisTaProf – aucun contenu ici : tout se modifie dans /admin
   Les textes sont lus dans content/*.json ; les fichiers dans media/
   ===================================================================== */
const $=s=>document.querySelector(s), dlg=$('#dlg');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=s=>esc(s).replace(/\\vec\{([^}]*)\}/g,'<span class="vec">$1</span>').replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>');
const plain=s=>String(s??'').replace(/\\vec\{([^}]*)\}/g,'$1').replace(/_\{([^}]*)\}/g,'$1').replace(/\^\{([^}]*)\}/g,'$1');
const slug=s=>plain(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fileUrl=u=>encodeURI(String(u||'').replace(/^\//,''));
const httpUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'#';
const ext=u=>(String(u||'').split('?')[0].split('.').pop()||'').toLowerCase();
const J=u=>fetch(u+'?v='+Math.floor(Date.now()/30000),{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const PAL={
 bleu:['#cfe3f8','#bcd7f3','#d9e9fb','#c6dcf5'], violet:['#ded3f4','#d0c2ef','#e7ddf8','#d9ccf2'],
 vert:['#cfead8','#bfe3cb','#dbf0e2','#c6e8d2'], orange:['#fbe3c4','#f8d6ab','#fdebd5','#f9dcb7'],
 rose:['#f9d5e2','#f4c3d6','#fbe1ea','#f6cbdb'], turquoise:['#c9ebe7','#b6e2dd','#d8f1ee','#bfe6e1']
};
/* variantes par thème : une famille de couleur distincte par grande partie (rubrique verte) */
const PALV={vert:['#cfead8','#c4e8e1','#e1e9c8'],bleu:['#cfe3f8','#c6e5ee','#d8d9f5','#c5d5ec'],violet:['#ded3f4','#efd6ec','#d3d7f4','#dccbe8']};
const TYPES={fiche:'Fiche',carte:'Carte mentale',qcm:'QCM',lien:'Lien',python:'Python'};
const S={acc:{},rub:{},order:[],cur:null};

/* ---------- chargement ---------- */
async function init(){
  try{S.acc=await J('content/accueil.json')}catch(e){S.acc={menu:[],liens:[]}}
  const res=await Promise.all((S.acc.menu||[]).map(k=>J('content/rubriques/'+k+'.json').then(d=>[k,d]).catch(()=>null)));
  for(const r of res)if(r){S.rub[r[0]]=r[1];S.order.push(r[0])}
  $('#tag').textContent=S.acc.slogan||'Physique-chimie au lycée';
  $('#foot').textContent=S.acc.pied||'';
  const gc=(S.acc.statistiques||'').trim().toLowerCase();
  if(/^[a-z0-9-]+$/.test(gc)){const t=document.createElement('script');t.async=true;t.src='https://gc.zgo.at/count.js';t.dataset.goatcounter='https://'+gc+'.goatcounter.com/count';document.head.append(t)}
  $('#nav').innerHTML=`<a href="#accueil" data-k="accueil">Accueil</a><a href="#stats" class="nst" data-stats><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V11M10 20V5M16 20v-6M21 20H3"/></svg>Mes statistiques</a>`+S.order.map(k=>`<a href="#${k}" data-k="${k}" style="--c:var(--c-${S.rub[k].couleur||'bleu'})">${fm(S.rub[k].nom)}</a>`).join('');
  visites();
  route();
}

/* ---------- pages ---------- */
function page(k){
  if(S.cur!==k)stat('page/'+k);
  S.cur=k;
  for(const a of document.querySelectorAll('#nav a')){if(a.dataset.k===k)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')}
  const r=S.rub[k];
  document.body.style.setProperty('--acc',r?`var(--c-${r.couleur||'bleu'})`:'var(--c-accueil)');
  if(!r){
    document.title='JeSuisTaProf – Physique-chimie au lycée : QCM corrigés et fiches méthodes';
    const tiles=S.order.map(x=>{const q=S.rub[x],n=q.sections.reduce((t,s)=>t+s.postits.length,0);
      return `<a class="pi" href="#${x}" style="--bg:${(PAL[q.couleur]||PAL.bleu)[0]}"><span class="code long">${fm(q.nom)}</span><span class="tx">${fm(q.intro||'')}</span><span class="st">${n} post-it</span></a>`}).join('');
    const liens=(S.acc.liens||[]).map(l=>`<a class="pi" href="${esc(httpUrl(l.url))}" target="_blank" rel="noopener"><span class="code long">${esc(l.nom)}</span><span class="tx">${esc(l.description||'')}</span><span class="st">ouvrir le site</span></a>`).join('');
    $('#main').innerHTML=`<section aria-labelledby="hA"><h2 class="th" id="hA">Bienvenue</h2><p class="intro">${esc(S.acc.bienvenue||'')}</p><div class="grid">${tiles}</div></section>`+
      (liens?`<section aria-labelledby="hL"><h2 class="th" id="hL">Liens utiles</h2><div class="grid">${liens}</div></section>`:'');
    return;
  }
  document.title='JeSuisTaProf – '+plain(r.nom)+' – Physique-chimie';
  let h=r.intro?`<p class="intro">${fm(r.intro)}</p>`:'',lastTheme=null,ti=-1;
  (r.sections||[]).forEach((s,i)=>{
    if(s.theme!==lastTheme){ti++;lastTheme=s.theme;h+=`<h2 class="th">${fm(s.theme)}</h2>`}
    if(s.partie)h+=`<h3 class="pt">${fm(s.partie)}</h3>`;
    h+=`<div class="grid">${(s.postits||[]).map((p,j)=>{
      const n=(p.ressources||[]).length,V=PALV[r.couleur],bg=n?` style="--bg:${V?V[ti%V.length]:(PAL[r.couleur]||PAL.bleu)[ti%4]}"`:'';
      return `<button class="pi${n?'':' vide'}"${bg} data-open="${k}/${slug((p.code||'')+' '+p.titre)}">${p.code?`<span class="code">${esc(String(p.code).trim().replace(/[\s\-–—).:]+$/,''))}</span>`:''}<span class="tx">${fm(p.titre)}</span>${!n?'<span class="st">bientôt</span>':r.compteur===false?'':`<span class="st">${n+(n>1?' ressources':' ressource')}</span>`}</button>`}).join('')}</div>`;
  });
  $('#main').innerHTML=h||'<p class="intro">Cette rubrique est vide pour le moment.</p>';
}

/* ---------- fenêtre d'un post-it ---------- */
function findPostit(k,sl){
  const r=S.rub[k];if(!r)return null;
  let best=null,bl=0;
  for(const s of r.sections||[])for(const p of s.postits||[]){const k2=slug((p.code||'')+' '+p.titre);if(k2===sl)return {s,p,r};
    /* lien ancien (titre raccourci depuis) : le nouveau nom est le début de l'ancien */
    if(sl.startsWith(k2+'-')&&k2.length>bl){best={s,p,r};bl=k2.length}}
  return best;
}
function openPostit(k,sl){
  if(dlg.classList.contains('full')){dlg._keep=(dlg._keep||0)+1;dlg.close();dlg.classList.remove('full');dlg._id=null;exitFull();document.body.classList.remove('qcm-on')}
  const f=findPostit(k,sl);if(!f){location.hash=k;return}
  const {s,p,r}=f,col=PAL[r.couleur]||PAL.bleu,res=p.ressources||[];
  if(dlg._pi!==k+'/'+sl){dlg._pi=k+'/'+sl;stat('postit/'+k+'/'+sl)}
  dlg.classList.remove('wide');
  dlg.innerHTML=`<div class="dh"><div><h2 id="dt">${p.code?esc(p.code)+') ':''}${fm(p.titre)}</h2><p>${fm(s.theme)}${s.partie?' · '+fm(s.partie):''}</p></div><button class="x" aria-label="Fermer" data-close>×</button></div><div class="db" id="body"></div>`;
  const list=()=>{
    dlg.classList.remove('wide');dlg._z=null;
    $('#body').innerHTML=res.length?`<div class="res">${res.map((x,i)=>`<button data-res="${i}" style="--bg:${col[i%4]}"><b>${TYPES[x.type]||'Ressource'}</b><span>${x.type==='qcm'&&NIV[x.niveau]?nivBadge(x.niveau):''}${fm(x.titre)}${x.type==='qcm'&&NIV[x.niveau]?`<span class="sous">${NIV[x.niveau][1]}</span>`:''}</span></button>`).join('')}</div>`
      :`<p class="vide-msg">Les ressources de ce post-it arrivent bientôt.</p>`;
    if(res.length===1&&!(res[0].type==='lien'&&!res[0].integrer))show(0);
  };
  const show=i=>{
    const x=res[i],b=$('#body');
    if(x.type==='qcm'){location.hash='qcm-'+x.qcm;return}
    stat('ressource/'+resName(x));
    if(x.type==='lien'&&!x.integrer){window.open(httpUrl(x.url),'_blank','noopener');return}
    dlg.classList.add('wide');
    b.innerHTML=`<div class="bar">${res.length>1?`<button class="btn alt" data-back>← Retour</button>`:''}<strong>${fm(x.titre)}</strong></div><div class="view" id="view"><p class="note">Chargement…</p></div>`;
    viewer(x,$('#view'));
  };
  dlg._list=list;dlg._show=show;
  list();
  if(!dlg.open)dlg.showModal();
}
/* nom lisible d'une ressource pour les statistiques anonymes : type/fichier (ou site pour un lien) */
function resName(x){let n='';try{n=x.fichier?String(x.fichier).split('/').pop():new URL(httpUrl(x.url)).hostname}catch(e){n='?'}return (x.type||'fichier')+'/'+n}
async function viewer(x,box){
  try{
    if(x.type==='lien'){
      const u=httpUrl(x.url);
      box.innerHTML=`<iframe src="${esc(u)}" title="${esc(plain(x.titre))}" allow="fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe><p class="note">Si le contenu ne s’affiche pas, <a href="${esc(u)}" target="_blank" rel="noopener">l’ouvrir dans un nouvel onglet</a>.</p>`;return;
    }
    const u=fileUrl(x.fichier),e=ext(x.fichier);
    if(!x.fichier){box.innerHTML='<p class="note">Aucun fichier n’est rattaché à cette ressource.</p>';return}
    if(x.type==='python'||e==='py'){
      const t=await fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.text()});
      const bz='https://console.basthon.fr/?from='+encodeURIComponent(new URL(u,location.href).href);
      box.innerHTML=`<div class="bar"><a class="btn" href="${bz}" target="_blank" rel="noopener">▶ Ouvrir dans Basthon</a><a class="btn alt" href="${u}" download>Télécharger</a><button class="btn alt" data-copy>Copier le code</button></div><p class="note">Basthon s’ouvre dans un nouvel onglet (gratuit, sans compte) : cliquer sur « Exécuter » pour lancer le programme.</p><pre><code></code></pre>`;
      box.querySelector('code').textContent=t;box._code=t;
      const nm='python/'+String(x.fichier).split('/').pop();
      box.querySelector('a[href^="https://console.basthon"]').addEventListener('click',()=>stat(nm+'/basthon'));
      box.querySelector('a[download]').addEventListener('click',()=>stat(nm+'/telecharge'));
      box._stat=nm;return;
    }
    if(e==='pdf'){
      box.innerHTML=`<div class="bar"><a class="btn alt" href="${u}" target="_blank" rel="noopener">Ouvrir dans un onglet</a><span class="zm" role="group" aria-label="Zoom"><button class="btn alt" data-zoom="-" aria-label="Réduire">−</button><output id="zv">100 %</output><button class="btn alt" data-zoom="+" aria-label="Agrandir">+</button><button class="btn alt" data-zoom="0">Ajuster</button></span></div><div class="pdfbox"></div>`;
      await pdf(u,box.querySelector('.pdfbox'));return;
    }
    if(['png','jpg','jpeg','gif','webp','svg'].includes(e)){box.innerHTML=`<a href="${u}" target="_blank" rel="noopener" title="Ouvrir l’image en grand"><img class="big" src="${u}" alt="${esc(plain(x.titre))}"></a><p class="note">Cliquer sur l’image pour l’ouvrir en grand dans un nouvel onglet.</p>`;return}
    box.innerHTML=`<p class="note">Ce type de fichier ne peut pas s’afficher dans la page.</p><a class="btn" href="${u}" download>Télécharger le fichier</a>`;
  }catch(err){box.innerHTML='<p class="note">Impossible d’afficher cette ressource pour le moment.</p>'}
}
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.append(s)})}
async function pdf(u,box){
  if(!window.pdfjsLib){await loadScript('lib/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='lib/pdf.worker.min.js'}
  const doc=await pdfjsLib.getDocument(u).promise,pages=document.createElement('div');
  let z=1,gen=0;pages.className='pdfpages';box.innerHTML='';box.append(pages);
  const P=[];
  const sharp=()=>Math.min(Math.max(window.devicePixelRatio||1,2),3);   // définition d'affichage : 2 à 3 fois la taille écran
  async function draw(p){
    if(p.busy)return;p.busy=true;const g=gen;
    try{
      let w=Math.round(p.wrap.clientWidth*sharp()),h=Math.round(w*p.h/p.w);
      const k=Math.sqrt(Math.min(1,16e6/(w*h)));w=Math.round(w*k);h=Math.round(h*k);   // plafond mémoire (téléphones)
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const vp=p.pg.getViewport({scale:w/p.w});
      p.task=p.pg.render({canvasContext:c.getContext('2d'),viewport:vp});await p.task.promise;
      if(g===gen&&p.vis){p.wrap.replaceChildren(c);p.done=true}
    }catch(err){}finally{p.busy=false}
    if(p.vis&&!p.done&&p.stale){p.stale=false;draw(p)}
  }
  const io=new IntersectionObserver(es=>{for(const en of es){
    const p=en.target._p;p.vis=en.isIntersecting;
    if(p.vis&&!p.done)draw(p);
    else if(!p.vis&&p.done){p.wrap.replaceChildren();p.done=false}      // libère la mémoire des pages éloignées
  }},{root:box.closest('.db'),rootMargin:'900px 0px'});
  for(let n=1;n<=doc.numPages;n++){
    const pg=await doc.getPage(n),v=pg.getViewport({scale:1}),wrap=document.createElement('div');
    wrap.className='pdfpg';wrap.style.aspectRatio=v.width+'/'+v.height;
    const p={pg,w:v.width,h:v.height,wrap,vis:false,done:false,busy:false};wrap._p=p;P.push(p);pages.append(wrap);io.observe(wrap);
  }
  const redraw=()=>{gen++;for(const p of P){if(p.task)try{p.task.cancel()}catch(e){}p.done=false;p.busy=false;p.wrap.replaceChildren();io.unobserve(p.wrap);io.observe(p.wrap)}};
  const apply=()=>{pages.style.width=(z*100)+'%';const o=$('#zv');if(o)o.textContent=Math.round(z*100)+' %';redraw()};
  dlg._z=d=>{z=d===0?1:Math.min(3,Math.max(.5,Math.round((z+d)*100)/100));apply()};
  let t;const onr=()=>{clearTimeout(t);t=setTimeout(()=>{if(!pages.isConnected){removeEventListener('resize',onr);return}redraw()},250)};
  addEventListener('resize',onr);
}

/* ---------- QR code ---------- */
function qrBox(){return `<div class="qr" id="qr"><div class="qc" id="qc"></div><p><button type="button" class="btn alt" id="qrd">Télécharger l’image</button></p><p class="note">Le QR code pointe vers l’adresse actuelle du site.</p></div>`}
async function qr(target,name){
  if(!window.QRCode)await loadScript('lib/qrcode.min.js');
  const box=$('#qr'),c=$('#qc');box.style.display='block';c.innerHTML='';
  new QRCode(c,{text:location.origin+location.pathname+'#'+target,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});
  $('#qrd').onclick=()=>{const cv=c.querySelector('canvas');if(!cv)return;const a=document.createElement('a');a.download='qrcode-'+name+'.png';a.href=cv.toDataURL('image/png');a.click()};
}

/* compteur de visites visible (GoatCounter, option « Allow adding visitor counts » activée) */
const VIS_ICO='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></svg>';
function visites(){
  const gc=(S.acc.statistiques||'').trim().toLowerCase(),show=n=>{const e=$('#vis');if(e&&n){e.innerHTML=`${VIS_ICO}<span><b>${n}</b> visite${n==='1'?'':'s'} sur le site</span>`;e.hidden=false}};
  if(!/^[a-z0-9-]+$/.test(gc))return;
  if(S.vis)return show(S.vis);
  fetch(`https://${gc}.goatcounter.com/counter/TOTAL.json`).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.count){S.vis=String(d.count).replace(/,/g,' ');show(S.vis)}}).catch(()=>{});
}
/* ---------- Mes statistiques : seulement dans le navigateur de l'élève (localStorage), rien n'est envoyé ---------- */
const SK='jstp-stats';
function stGet(){try{const o=JSON.parse(localStorage.getItem(SK)||'null');return o&&o.pseudo?o:null}catch(e){return null}}
function stSet(o){try{if(o)localStorage.setItem(SK,JSON.stringify(o));else localStorage.removeItem(SK);return true}catch(e){return false}}
function stAdd(r){const o=stGet();if(!o)return false;o.res=(o.res||[]).concat(r).slice(-3000);return stSet(o)}
/* QCM -> rubrique et post-it, d'après content/rubriques */
function qcmIndex(){const I={};S.order.forEach(k=>{const r=S.rub[k];(r.sections||[]).forEach(s=>(s.postits||[]).forEach(p=>(p.ressources||[]).forEach(x=>{if(x.type==='qcm'&&x.qcm&&!I[x.qcm])I[x.qcm]={k,p,niv:+x.niveau||0,t:x.titre}})))});return I}
function unfull(){if(!dlg.classList.contains('full'))return;if(dlg.open){dlg._keep=(dlg._keep||0)+1;dlg.close()}dlg.classList.remove('full');dlg._id=null;exitFull();document.body.classList.remove('qcm-on')}
const pct=r=>r.c?Math.round(100*r.pts/r.n):r.pc;
const shown=r=>r.c?`${r.pts<0?'−'+(-r.pts):r.pts}&nbsp;/&nbsp;${r.n}&nbsp;pts`:`${r.pc}&nbsp;%`;
const fdate=t=>new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
function openStats(){
  unfull();dlg.classList.remove('wide');dlg._z=null;
  const o=stGet(),head=`<div class="dh"><div><h2 id="dt">📊 Mes statistiques</h2><p>${o?'Pseudo : <strong>'+esc(o.pseudo)+'</strong> · ':''}enregistrées uniquement sur cet appareil</p></div><button class="x" aria-label="Fermer" data-close>×</button></div>`;
  let b='';
  if(!o){
    b=`<p>Conserver ses résultats aux QCM pour suivre sa progression, chapitre par chapitre.</p>
    <ul class="sinfo"><li>Faire les QCM sur le même appareil.</li><li>Rien n’est envoyé sur Internet.</li><li>Choisir un pseudo, pas son vrai nom.</li></ul>
    <form class="sform" id="sf"><label>Pseudo<input id="ps" maxlength="20" required autocomplete="off" placeholder="ex. Neutrino42"></label><button class="btn">Activer les statistiques</button></form><p class="note" id="sfm"></p><p class="note"><button type="button" class="lnk" data-restore>Restaurer une sauvegarde</button></p>`;
  }else b=stBoard(o);
  dlg.innerHTML=head+`<div class="db">${b}</div>`;
  const f=$('#sf');if(f)f.onsubmit=e=>{e.preventDefault();const v=$('#ps').value.trim().replace(/\s+/g,' ');if(!v)return;
    if(stSet({v:1,pseudo:v,depuis:Date.now(),res:[]})){stat('statistiques/activees');openStats()}else $('#sfm').textContent='Enregistrement bloqué par le navigateur (navigation privée ?) : statistiques impossibles ici.'};
  const del=$('#sdel');if(del)del.onclick=()=>{if(del.dataset.ok){stSet(null);openStats();return}del.dataset.ok=1;del.textContent='Confirmer : tout effacer';$('#sdelm').textContent='Résultats et pseudo supprimés de cet appareil, définitivement.'};
  if(!dlg.open)dlg.showModal();
}
function stBoard(o){
  const R=o.res||[],I=qcmIndex(),by={};
  R.forEach(r=>{(by[r.id]=by[r.id]||[]).push(r)});
  const ids=Object.keys(by);
  if(!ids.length)return `<p>Statistiques activées. Terminer un QCM (bouton « Valider les réponses ») pour voir apparaître le premier résultat.</p>`+stFoot();
  /* bilan par QCM */
  const Q=ids.map(id=>{const a=by[id],last=a[a.length-1],best=a.reduce((m,r)=>pct(r)>pct(m)?r:m,a[0]),x=I[id]||{},seuil=last.obj||(last.c?60:70);
    return {id,a,last,best,seuil,ok:pct(last)>=seuil,x,titre:x.t||last.t||id,niv:x.niv||last.niv||0}});
  const chap=q=>q.x.p?`${q.x.p.code?q.x.p.code+') ':''}${plain(q.x.p.titre)}`:q.titre;
  const lab=q=>{const p=q.x.p;if(!p)return esc(plain(q.titre));const c=/^\d+$/.test(String(p.code||'').trim())?'ch. '+esc(p.code):fm(p.titre);return `${esc(({premiere:'1re',terminale:'Tle',methodes:'Méthodes',python:'Python'})[q.x.k]||S.rub[q.x.k].nom.split(' ')[0])} · ${c} · ${esc(plain(q.titre))}`};
  const forts=Q.filter(q=>q.ok),aRev=Q.filter(q=>!q.ok);
  const jours=new Set(R.map(r=>new Date(r.d).toDateString())).size;
  let h=`<div class="skpi"><div><b>${R.length}</b><span>QCM terminé${R.length>1?'s':''}</span></div><div><b>${new Set(Q.map(q=>q.x.p?q.x.k+'/'+q.x.p.code+q.x.p.titre:q.id)).size}</b><span>chapitre${Q.length>1?'s':''} travaillé${Q.length>1?'s':''}</span></div><div><b>${jours}</b><span>jour${jours>1?'s':''} d’entraînement</span></div><div><b>${forts.length}/${Q.length}</b><span>QCM réussis au dernier essai</span></div></div>`;
  /* listes courtes : 3 éléments, le reste dans « Voir les N autres » */
  const lst=(arr,vide)=>{if(!arr.length)return `<p class="note">${vide}</p>`;const li=q=>`<li>${lab(q)}&nbsp;: ${shown(q.last)}</li>`;
    return '<ul>'+arr.slice(0,3).map(li).join('')+'</ul>'+(arr.length>3?`<details class="smore"><summary>Voir les ${arr.length-3} autres</summary><ul>${arr.slice(3).map(li).join('')}</ul></details>`:'')};
  forts.sort((x,y)=>pct(y.last)-pct(x.last));aRev.sort((x,y)=>pct(x.last)-pct(y.last));
  h+=`<div class="sbil"><section><h3><svg class="sic" style="color:var(--c-vert)" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="6"/><path d="M8.5 9L6 3h4l2 4 2-4h4l-2.5 6"/><path d="M10 14l1.5 1.5L14.5 12.5"/></svg>Points forts</h3>${lst(forts,'Pas encore : viser l’objectif de chaque QCM.')}</section>
  <section><h3><svg class="sic" style="color:var(--c-bleu)" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6 4 4 6-7"/><path d="M15 8h5v5"/></svg>Prochains objectifs</h3>${lst(aRev,'Rien pour l’instant.')}</section></div>`;
  /* bilan par chapitre : une rubrique repliable, un chapitre = une barre (moyenne des derniers scores de ses QCM), à toucher pour le détail */
  const groups=[];S.order.forEach(k=>{const r=S.rub[k],chs=[];(r.sections||[]).forEach(s=>(s.postits||[]).forEach(p=>{const qs=Q.filter(q=>q.x.p===p);if(qs.length)chs.push({p,qs:qs.sort((a,b)=>a.niv-b.niv),v:Math.round(qs.reduce((t,q)=>t+Math.max(0,pct(q.last)),0)/qs.length)})}));if(chs.length)groups.push({k,r,chs})});
  const autres=Q.filter(q=>!q.x.p),lastK=(I[R[R.length-1].id]||{}).k;
  const row=q=>`<div class="srow"><div>${q.niv&&NIV[q.niv]?nivBadge(q.niv):''}${esc(plain(q.titre))}<br><small class="note">${q.a.length} essai${q.a.length>1?'s':''} · dernier le ${fdate(q.last.d)}</small></div>
    <div class="spark" aria-hidden="true">${q.a.slice(-10).map(r=>`<i class="${pct(r)>=q.seuil?'ok':''}" style="height:${Math.max(4,Math.min(100,pct(r)))}%"></i>`).join('')}</div>
    <div class="sv"><b>${shown(q.last)}</b><small>meilleur : ${shown(q.best)}</small></div></div>`;
  h+=`<h3 class="sbt">Bilan par chapitre</h3><p class="note">Ouvrir un chapitre pour le détail. Pointillés : 70 %.</p>`;
  groups.forEach(g=>{const col=`--rc:var(--c-${g.r.couleur||'bleu'})`;
    h+=`<details class="srd" style="${col}"${g.k===lastK||groups.length===1?' open':''}><summary>${fm(g.r.nom)} <small>${g.chs.length} chapitre${g.chs.length>1?'s':''}</small></summary>${g.chs.map(c=>{const code=String(c.p.code||'').trim();
      return `<details class="scd"><summary class="sbar"><span class="l" title="${esc(plain(c.p.titre))}">${/^\d+$/.test(code)?'Ch. '+esc(code):fm(c.p.titre)}</span><span class="t"><i style="width:${c.v}%"></i><s></s></span><b>${c.v}&nbsp;%</b></summary><div class="sch"><h4>${code?esc(code)+') ':''}${fm(c.p.titre)}</h4>${c.qs.map(row).join('')}</div></details>`}).join('')}</details>`});
  if(autres.length)h+=`<details class="srd"><summary>Autres QCM <small>${autres.length}</small></summary><div class="sch">${autres.map(row).join('')}</div></details>`;
  return h+stFoot();
}
function stFoot(){return `<div class="sfoot"><button type="button" class="btn" data-save>Sauvegarder</button><button type="button" class="btn alt" data-restore>Restaurer</button><button type="button" class="btn alt" id="sdel">Effacer</button><small id="sdelm"></small></div>`}
/* sauvegarde dans un fichier (Téléchargements) et restauration depuis ce fichier */
function stSave(){const o=stGet();if(!o)return;const d=new Date(),f=`jesuistaprof-${o.pseudo.replace(/[^\w-]+/g,'_')}-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=f;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  const m=$('#sdelm');if(m)m.textContent='Fichier enregistré dans Téléchargements.'}
function stRestore(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o||!o.pseudo||!Array.isArray(o.res))throw 0;
    const cur=stGet();if(cur){const k=r=>r.id+'|'+r.d,seen=new Set(cur.res.map(k));o.res=cur.res.concat(o.res.filter(r=>!seen.has(k(r)))).sort((a,b)=>a.d-b.d);o.pseudo=cur.pseudo}
    if(!stSet(o))throw 0;openStats()}).catch(()=>{const m=$('#sdelm')||$('#sfm');if(m)m.textContent='Fichier non reconnu.'})};i.click()}

/* ---------- QCM ---------- */
const NIV={1:['★','Cours et TP, sans calcul · objectif 90 %'],2:['★★','Calculs courts'],3:['★★★','Énoncés type contrôle · barème +1 / −1']};
const nivBadge=n=>`<span class="niv n${n}">Niveau ${n} ${NIV[n][0]}</span>`;
/* questions protégées : champ q64 = base64(octets UTF-8 du JSON XOR clé) */
const unveil=q=>{if(!q.q64)return q;const k=new TextEncoder().encode('JeSuisTaProf'),b=Uint8Array.from(atob(q.q64),c=>c.charCodeAt(0)).map((v,i)=>v^k[i%k.length]);return {...q,questions:JSON.parse(new TextDecoder().decode(b))}};
const stat=path=>{try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count({path,title:path,event:true})}catch(e){}};
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function goFull(){if(fsEl())return null;const d=document.documentElement,f=d.requestFullscreen||d.webkitRequestFullscreen;if(!f)return null;try{const r=f.call(d,{navigationUI:'hide'});return r&&r.then?Promise.race([r.catch(()=>{}),new Promise(o=>setTimeout(o,800))]):null}catch(e){return null}}
function exitFull(){if(!fsEl())return;const f=document.exitFullscreen||document.webkitExitFullscreen;try{const r=f&&f.call(document);if(r&&r.catch)r.catch(()=>{})}catch(e){}}
/* quitter un QCM commencé : demande de confirmation (×, Échap, bouton Retour du téléphone) */
function askQuit(){if(!dlg._dirty){dlg.close();return}const b=$('#quit');if(b){b.classList.add('on');b.querySelector('[data-stay]').focus()}}
async function openQcm(id){
  const fp=goFull();
  let q;try{q=unveil(await J('content/qcm/'+id+'.json'))}catch(e){location.hash=S.cur||'accueil';return}
  document.body.classList.add('qcm-on');stat('qcm/'+id+'/ouvert');
  dlg._id=id;dlg._dirty=false;
  const ALL=(q.questions||[]).map(x=>(x.format==='vraifaux'||x.type==='vraifaux')?{...x,vf:1,choix:['Vrai','Faux'],bonne:x.vrai?1:2}:{...x});
  const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  /* blocs : une question isolée, ou un exercice (énoncé + questions qui suivent jusqu'au prochain énoncé) */
  const B=[];let cur=null;
  ALL.forEach(x=>{if((x.enonce||'').trim()){cur=[x];B.push({ex:1,q:cur})}else if(cur)cur.push(x);else B.push({ex:0,q:[x]})});
  const nT=+q.tirage||0,nX=+q.tirage_exercices||0,conc=q.bareme==='concours',obj=+q.objectif||0;let sel=B;
  if(nX>0&&nX<B.filter(b=>b.ex).length){
    /* on garde toutes les questions isolées et on tire nX exercices entiers */
    const keep=new Set(mix(B.filter(b=>b.ex)).slice(0,nX));
    sel=[...B.filter(b=>!b.ex&&!b.q[0].defi),...mix([...keep]),...B.filter(b=>!b.ex&&b.q[0].defi)];
  }else
  if(nT>0&&nT<ALL.length){
    const solo=mix(B.filter(b=>!b.ex&&!b.q[0].defi)),exo=mix(B.filter(b=>b.ex)),defi=B.filter(b=>!b.ex&&b.q[0].defi);
    let n=0;const pick=[];
    const tryAdd=b=>{if(n+b.q.length<=nT||!pick.length){pick.push(b);n+=b.q.length}};
    /* environ un tiers d'exercices, le reste en questions isolées, le Défi isolé en dernier s'il reste de la place */
    const cible=Math.round(nT/3);let ne=0;for(const b of exo){if(ne>=cible)break;if(n+b.q.length<=nT){pick.push(b);n+=b.q.length;ne+=b.q.length}}
    for(const b of solo){if(n>=nT-defi.length)break;tryAdd(b)}
    for(const b of defi)tryAdd(b);
    for(const b of solo){if(n>=nT)break;if(!pick.includes(b))tryAdd(b)}
    sel=[...mix(pick.filter(b=>!b.ex&&!b.q[0].defi)),...pick.filter(b=>b.ex),...pick.filter(b=>!b.ex&&b.q[0].defi)];
  }
  const Q=sel.flatMap(b=>b.q);
  if(q.melanger)Q.forEach(x=>{if(x.vf||!Array.isArray(x.choix))return;const ord=mix(x.choix.map((_,j)=>j));const b=(+x.bonne||1)-1;x.choix=ord.map(j=>x.choix[j]);x.bonne=ord.indexOf(b)+1});
  const fb=s=>fm(s).replace(/\n/g,'<br>');
  let ex=0;
  const blocs=Q.map((x,i)=>{
   const e=(x.enonce||'').trim(),en=e?`<div class="enonce"><h3>Exercice ${++ex}</h3>${fb(e)}${x.figure?`<img src="${fileUrl(x.figure)}" alt="Figure de l’exercice ${ex}" loading="lazy">`:''}</div>`:'';
   return en+`<fieldset class="q${x.defi?' defi':''}${x.vf?' vf':''}"><legend>${i+1}. ${x.defi?'<span class="defi-t">Défi</span> ':''}${x.vf?'<em>Vrai ou faux ?</em> ':''}${fb(x.question)}</legend><div class="opts">${(x.choix||[]).map((o,j)=>
   `<label><input type="radio" name="q${i}" value="${j}"><span>${fm(o)}</span></label>`).join('')}</div>${conc?`<button type="button" class="clr" data-clr="${i}">Effacer la réponse</button>`:''}</fieldset>`}).join('');
  dlg.classList.remove('wide');
  dlg.innerHTML=`<div class="quit" id="quit" role="alertdialog" aria-labelledby="quitT"><p id="quitT">Quitter le QCM ? Les réponses seront perdues.</p><button type="button" class="btn" data-stay>Continuer le QCM</button><button type="button" class="btn alt" data-leave>Quitter</button></div><div class="dh"><div><h2 id="dt">${NIV[q.niveau]?nivBadge(q.niveau)+'<br>':''}${fm(q.titre)}</h2><p>${nX>0&&nX<B.filter(b=>b.ex).length?`${nX} exercices tirés au hasard parmi ${B.filter(b=>b.ex).length}, soit ${Q.length} questions : chaque essai est différent`:`${Q.length} questions${Q.length<ALL.length?` tirées au hasard parmi ${ALL.length} : chaque essai est différent`:''}`}. Prévoir un brouillon. ${stGet()?'Résultat ajouté aux statistiques, sur cet appareil.':'Rien n’est enregistré : le résultat reste à l’écran.'}</p>${conc?`<p class="bareme"><strong>Barème concours</strong> : +1 si la réponse est juste, −1 si elle est fausse, 0 sans réponse. Ne cocher que ce qui a été vérifié par le calcul.</p>`:''}${obj?`<p class="bareme"><strong>Objectif</strong> : au moins ${obj} % de bonnes réponses.</p>`:''}</div><button class="x" aria-label="Fermer" data-close>×</button></div>
  <div class="db"><div class="score" id="score" tabindex="-1"></div><form id="f">${blocs}
   <button type="button" class="btn" id="val">Valider les réponses</button>
   <button type="button" class="btn alt" id="again" style="display:none">Recommencer</button>
</form></div>`;
  $('#val').onclick=()=>{
    let sc=0,nf=0,nv=0;
    document.querySelectorAll('.clr').forEach(b=>b.remove());
    Q.forEach((x,i)=>{
      const fs=document.querySelectorAll('.q')[i],labs=fs.querySelectorAll('label'),ch=fs.querySelector('input:checked'),v=ch?+ch.value:-1,a=(+x.bonne||1)-1;
      if(v===a)sc++;else if(v<0)nv++;else nf++;
      labs.forEach((l,j)=>{if(j===a)l.classList.add('good');else if(j===v)l.classList.add('bad')});
      fs.querySelectorAll('input').forEach(e=>e.disabled=true);
      const p=document.createElement('p');p.className='exp';
      p.innerHTML=`<strong>${v===a?'Correct.':v<0?'Pas de réponse.':'Incorrect.'}</strong>${x.vf?` L’affirmation est <strong>${x.vrai?'vraie':'fausse'}</strong>.`:''} ${fb(x.explication||'')}`;fs.append(p);
    });
    const n=Q.length,pc=Math.round(100*sc/n),el=$('#score');let h;
    if(conc){
      const pts=sc-nf,m=pts===n?'Parfait : tout est juste.':pts>=n*.6?'Très bon résultat : relire les corrections des erreurs.':pts>0?'Relire les corrections, refaire les calculs au brouillon puis recommencer.':'Score nul ou négatif : revoir le cours et les méthodes avant de recommencer.';
      h=`<strong>${pts<0?'−'+(-pts):pts} / ${n} points</strong><p>${m}</p><p class="det">${sc} juste${sc>1?'s':''}${sc?` (+${sc})`:''}, ${nf} fausse${nf>1?'s':''}${nf?` (−${nf})`:''}, ${nv} sans réponse.<br>Répondre au hasard rapporte 0 point en moyenne : seules les réponses vérifiées font gagner des points.</p>`;
    }else{
      const m=obj?(pc>=obj?`Objectif atteint (${obj} %) : chapitre maîtrisé.`:`Objectif : ${obj} %. Relire les corrections puis recommencer.`):(sc===n?'Parfait : chapitre maîtrisé.':sc>=n*.6?'Bien joué : relire les corrections des erreurs.':'Revoir la fiche du chapitre puis recommencer.');
      h=`<strong>${pc} %</strong><p>${m}</p><p class="det">${sc} bonne${sc>1?'s':''} réponse${sc>1?'s':''} sur ${n}.</p>`;
    }
    /* statistique anonyme pour la professeure : tranche de score par QCM */
    {const v=conc?Math.round(100*(sc-nf)/n):pc;stat('qcm/'+id+'/score/'+(v>=80?'80-100':v>=50?'50-79':'0-49'))}
    const so=stGet();
    if(so){const ok=stAdd({id,d:Date.now(),t:plain(q.titre),niv:+q.niveau||0,n,sc,pc,...(conc?{c:1,pts:sc-nf}:{}),...(obj?{obj}:{})});
      h+=ok?`<p class="sst">✔ Résultat enregistré dans les statistiques (${esc(so.pseudo)}). <button type="button" class="btn alt" data-stats>Voir les statistiques</button></p>`:`<p class="sst">Résultat non enregistré sur cet appareil.</p>`}
    else h+=`<p class="sst">Suivre sa progression ? <button type="button" class="btn alt" data-stats>Activer les statistiques</button></p>`;
    el.style.display='block';el.innerHTML=h;el.focus();stat('qcm/'+id+'/termine');dlg._dirty=false;
    $('#val').style.display='none';$('#again').style.display='inline-block';
  };
  $('#again').onclick=()=>openQcm(id);
  $('#f').addEventListener('change',()=>{dlg._dirty=true});
  /* le plein écran réel doit être en place avant d'afficher la fenêtre, sinon la page passerait devant */
  if(fp)await fp;
  if(dlg.open&&(fp||!dlg.classList.contains('full'))){dlg._keep=(dlg._keep||0)+1;dlg.close()}
  dlg.classList.add('full');
  if(!dlg.open)dlg.showModal();
  dlg.querySelector('.db').scrollTop=0;
}

/* ---------- navigation ---------- */
function route(){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  if(dlg.open&&dlg.classList.contains('full')&&dlg._dirty&&h!=='qcm-'+dlg._id){history.pushState(null,'','#qcm-'+dlg._id);askQuit();return}
  if(h==='stats'){if(!S.cur)page('accueil');openStats();return}
  if(h.startsWith('qcm-')){if(!S.cur)page('accueil');if(!(dlg.open&&dlg._id===h.slice(4)))openQcm(h.slice(4));return}
  const [k,p]=h.split('/'),key=(k&&S.rub[k])?k:'accueil';
  if(S.cur!==key)page(key);
  if(p)openPostit(key,p);else if(dlg.open)dlg.close();
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stats]')){location.hash='stats';return}
  if(e.target.closest('[data-save]')){stSave();return}
  if(e.target.closest('[data-restore]')){stRestore();return}
  const t=e.target.closest('[data-open],[data-res],[data-back],[data-close],[data-qr],[data-copy],[data-zoom]');if(!t)return;
  if(t.dataset.open)location.hash=t.dataset.open;
  else if('res' in t.dataset)dlg._show(+t.dataset.res);
  else if('back' in t.dataset)dlg._list();
  else if('zoom' in t.dataset){if(dlg._z)dlg._z(t.dataset.zoom==='0'?0:t.dataset.zoom==='+'?.25:-.25)}
  else if(t.dataset.qr)qr(t.dataset.qr,slug(t.dataset.qr));
  else if('copy' in t.dataset){const b=$('#view');if(b._stat)stat(b._stat+'/copie');navigator.clipboard&&navigator.clipboard.writeText(b._code||'').then(()=>{t.textContent='Copié'})}
  else if(dlg.classList.contains('full'))askQuit();
  else dlg.close();
});
dlg.addEventListener('click',e=>{if(e.target===dlg&&!dlg.classList.contains('full'))dlg.close();
  if(e.target.closest('[data-stay]'))$('#quit').classList.remove('on');
  if(e.target.closest('[data-leave]')){dlg._dirty=false;dlg.close()}const c=e.target.closest('[data-clr]');if(c)c.closest('fieldset').querySelectorAll('input').forEach(r=>r.checked=false)});
dlg.addEventListener('cancel',e=>{if(dlg.classList.contains('full')){e.preventDefault();askQuit()}});
dlg.addEventListener('close',()=>{if(dlg._keep){dlg._keep--;return}{const m=document.querySelector('.mst span');if(m)m.textContent=stGet()?'Résultats aux QCM, chapitre par chapitre.':'Suivre sa progression aux QCM (facultatif, rien n’est envoyé sur Internet).'}exitFull();dlg._dirty=false;dlg._id=null;document.body.classList.remove('qcm-on');dlg.classList.remove('wide','full');dlg._z=null;if(/^#(qcm-|stats$|[^/]+\/)/.test(location.hash))history.replaceState(null,'','#'+(S.cur||'accueil'))});
addEventListener('hashchange',route);
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
